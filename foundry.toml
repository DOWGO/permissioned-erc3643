[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
# v4-periphery PermissionedPositionManager + PermissionedV4Router runtime bytecodes
# exceed the EIP-170 24,576-byte limit without aggressive optimization. The upstream
# Uniswap config compiles posm with via_ir + 30000 runs — we mirror that here so the
# resulting artifacts in deployer/src/config/ are actually deployable on-chain.
via_ir = true
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
